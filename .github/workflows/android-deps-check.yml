name: Android dependency check

# Build-only verification for the two Android projects.
#
# Why it exists: `build-kiosk.yml` / `build-health-bridge.yml` only run on `main`
# and they *publish* (keystore secrets, release tag, OTA commit). So until now a
# dependency bump reached main completely unverified — which is exactly how the
# androidx / AGP bumps of October 2026 broke both builds and had to be undone with
# follow-up commits. This job compiles a **debug** APK instead: no secrets, no
# signing material, nothing published anywhere. A pull request that touches either
# project gets an answer before it is merged.
#
# The asymmetry between the two legs is deliberate:
#   * the kiosk has **no** Gradle wrapper (its CI uses the pinned Gradle) → `gradle`
#   * the Health Bridge ships a wrapper (jar + gradlew)                  → `./gradlew`
#     so a wrapper upgrade is really exercised, not bypassed by the pinned version.

on:
  pull_request:
    paths:
      - 'evershelf-kiosk/**'
      - 'evershelf-health-bridge/**'
      - '.github/workflows/android-deps-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: kiosk
            dir: evershelf-kiosk
            wrapper: 'false'
          - project: health-bridge
            dir: evershelf-health-bridge
            wrapper: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Kotlin 2.4 wants >= 8.14.4; keep in sync with gradle-wrapper.properties.
          gradle-version: '8.14.4'

      - name: Debug keystore (AGP needs one when keystore.properties is absent)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Toolchain in use
        working-directory: ${{ matrix.dir }}
        run: |
          echo "--- gradle wrapper ---"
          cat gradle/wrapper/gradle-wrapper.properties
          echo "--- plugin versions ---"
          grep -n 'com.android.application\|org.jetbrains.kotlin.android' build.gradle.kts

      - name: Assemble debug APK
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          if [ '${{ matrix.wrapper }}' = 'true' ] && [ -x gradlew ]; then
            echo "Building with the project wrapper (what a developer uses locally)"
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Building with the Gradle on PATH (as the release workflow does)"
            gradle assembleDebug --no-daemon --stacktrace
          fi
          find . -name '*.apk' -print
