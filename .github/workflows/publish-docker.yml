name: Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.16.3); leave empty for no version tag'
        type: string
        required: false
        default: ''
      latest:
        description: 'Also tag the image as latest'
        type: boolean
        required: false
        default: true
  # Called by ci.yml right after it creates a release: a push/tag made with a
  # token inside a workflow cannot trigger this one, so the release job calls it
  # directly (no PAT, no manual dispatch).
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.16.3) when called by the release job'
        type: string
        required: false
        default: ''
      latest:
        description: 'Also tag the image as latest'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: evershelf

jobs:
  publish:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.latest == true || github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != null && inputs.version != '' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
