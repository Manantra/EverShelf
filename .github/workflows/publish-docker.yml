name: Publish Docker Image

# Publishing is a deliberate operator action. A push to main or a version tag
# must NEVER publish automatically; the CI workflow is build/test-only.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH-DOCKER to authorize publishing to GHCR'
        type: string
        required: true
      version:
        description: 'Optional version tag (e.g. 1.16.27)'
        type: string
        required: false
        default: ''
      latest:
        description: 'Explicitly overwrite GHCR latest (normally leave disabled)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: evershelf

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'PUBLISH-DOCKER' }}
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.latest == true }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != null && inputs.version != '' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
