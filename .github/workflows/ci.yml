name: CI

on:
  push:
    branches: [main, develop, 'stability/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop, 'stability/**']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-php:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, curl, mbstring

      - name: Check PHP syntax
        run: |
          set -euo pipefail
          find api/ scripts/ -name '*.php' -print0 | xargs -0 -n1 php -l

  lint-js:
    name: JavaScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check JS syntax
        run: |
          node -c assets/js/app.js

      - name: Verify SemVer and PWA cache consistency
        run: python3 scripts/test-version-consistency.py

  regression-tests:
    name: PHP and write-acknowledgement regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, mbstring, iconv, intl, gd, xml, zip

      - name: Ensure all publishing workflows require manual authorization
        run: python3 scripts/test-release-workflow-gate.py

      - name: Run all existing PHP regressions
        run: |
          set -euo pipefail
          for test in scripts/test-*.php; do
            echo "Testing $test"
            php "$test"
          done

      - name: Validate SQLite online restore, rollback and corrupted HTTP backups
        run: |
          php scripts/test-backup-restore-safety.php
          python3 scripts/test-backup-restore-http.py

      - name: Verify optional shell backup retention and WAL snapshot rotation
        run: python3 scripts/test-backup-shell-retention.py

      - name: Exercise real WAL backup and verify finished SQLite snapshot
        run: |
          php scripts/test-backup-integrity-php.php
          python3 scripts/test-backup-integrity-http.py

      - name: Verify one-time API token generation and no-lockout upgrade policy
        run: python3 scripts/test-api-token-autogen.py

      - name: Verify Home Assistant and native kiosk token migration
        run: python3 scripts/test-ha-kiosk-token-migration.py

      - name: Verify secure Home Assistant sensor YAML exports
        run: node scripts/test-ha-sensor-auth-yaml.js

      - name: Check failed write acknowledgements
        run: node scripts/test-write-acknowledgements.js

      - name: Verify Settings writes wait for consistent SQLite acknowledgements
        run: node scripts/test-settings-sync.js

      - name: Simulate Safari/PWA storage, suspended replay, and tab conflicts
        run: node scripts/test-pwa-offline-queue.js

      - name: Verify exactly-once online intents and durable Safari replay
        run: node scripts/test-durable-online-write.js

      - name: Verify phone inventory tap, swipe and package size display
        run: node scripts/test-inventory-mobile-tap.js

      - name: Verify iPhone swipe transient API errors and centered labels
        run: node scripts/test-inventory-transient-errors.js

      - name: Verify product-detail disposal and inventory-only removal stay separate
        run: node scripts/test-disposal-entrypoints.js

      - name: Verify compact disposal form and explicit full-disposal confirmation
        run: node scripts/test-disposal-layout.js

      - name: Verify combined product and stock card on Use and Dispose
        run: node scripts/test-combined-product-stock-card.js

      - name: Verify compact localized package labels on narrow phones
        run: node scripts/test-compact-package-badges.js

      - name: Verify heartbeat state, timeout and reconnect logic
        run: node scripts/test-heartbeat.js

      - name: Verify both product editing screens handle stale writes
        run: node scripts/test-product-conflict-ui.js

      - name: Verify localization references
        run: python3 scripts/i18n-audit.py

      - name: Verify stock unit conversion and stable-unit source contract
        run: python3 scripts/test-inventory-unit-contract.py

      - name: Exercise real HTTP and SQLite persistence in a disposable sandbox
        run: |
          set -euo pipefail
          mkdir -p data logs
          printf 'EVERSHELF_SANDBOX=1\nAPP_LANG=de\nSHOPPING_MODE=internal\nAI_ENABLED=false\nBARCODE_OFFLINE_ENABLED=false\nREPORT_ENABLED=false\nALLOW_OPEN_LAN=true\n' > .env
          php -S 127.0.0.1:18080 -t . > /tmp/evershelf-e2e-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent 'http://127.0.0.1:18080/api/index.php?action=ping' > /dev/null; then
              break
            fi
            sleep 0.5
          done
          python3 scripts/test-http-persistence.py --sandbox-root . --base-url http://127.0.0.1:18080
          python3 scripts/integration-shopping-dismiss.py --sandbox-root . --base-url http://127.0.0.1:18080
          python3 scripts/integration-restock-settings.py --sandbox-root . --base-url http://127.0.0.1:18080 --mode both
          # Separate PHP workers on the same disposable WAL DB, not a mock.
          php -S 127.0.0.1:18081 -t . > /tmp/evershelf-e2e-php-second.log 2>&1 &
          second_pid=$!
          trap 'kill "$server_pid" "$second_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent 'http://127.0.0.1:18081/api/index.php?action=ping' > /dev/null; then
              break
            fi
            sleep 0.5
          done
          python3 scripts/integration-concurrent-inventory.py --sandbox-root . --base-url http://127.0.0.1:18080 --second-url http://127.0.0.1:18081 --rounds 3 --parallel 12
          python3 scripts/integration-idempotent-offline-add.py --sandbox-root . --base-url http://127.0.0.1:18080 --second-url http://127.0.0.1:18081
          python3 scripts/integration-offline-conflict-resolution.py --sandbox-root . --base-url http://127.0.0.1:18080 --second-url http://127.0.0.1:18081
          python3 scripts/integration-recent-actual-use.py --sandbox-root . --base-url http://127.0.0.1:18080
          python3 scripts/integration-usage-waste-stats.py --sandbox-root . --base-url http://127.0.0.1:18080
          # CI uses a single disposable loopback IP and a shared 120 req/min
          # bucket for every unrelated integration suite. This test alone adds
          # legitimate API traffic, making later concurrency assertions see
          # an incidental 429 rather than the intended version-conflict 409.
          # Clear ONLY the synthetic sandbox limiter here; never production.
          grep -qx 'EVERSHELF_SANDBOX=1' .env
          if [ -d data/rate_limits ]; then
            find data/rate_limits -maxdepth 1 -type f -name '*.json' -delete
          fi
          python3 scripts/integration-concurrent-product-edit.py --sandbox-root . --base-url http://127.0.0.1:18080 --second-url http://127.0.0.1:18081
          python3 scripts/integration-concurrent-field-edits.py --sandbox-root . --base-url http://127.0.0.1:18080 --second-url http://127.0.0.1:18081
          python3 scripts/integration-atomic-product-inventory.py --sandbox-root . --base-url http://127.0.0.1:18080 --second-url http://127.0.0.1:18081
          node scripts/integration-offline-replay-conflicts.js --sandbox-root . --base-url http://127.0.0.1:18080
          # Isolated new unit/CSV regression: clear only synthetic rate-limit buckets.
          grep -qx 'EVERSHELF_SANDBOX=1' .env
          if [ -d data/rate_limits ]; then
            find data/rate_limits -maxdepth 1 -type f -name '*.json' -delete
          fi
          python3 scripts/integration-inventory-units.py --sandbox-root . --base-url http://127.0.0.1:18080
          # Real keyed-use/receipt and atomic-spend tests may consume the CI
          # loopback request budget; clear only in the marked disposable QA DB.
          grep -qx 'EVERSHELF_SANDBOX=1' .env
          if [ -d data/rate_limits ]; then
            find data/rate_limits -maxdepth 1 -type f -name '*.json' -delete
          fi
          python3 scripts/integration-exactly-once-use-spend.py --sandbox-root . --base-url http://127.0.0.1:18080 --second-url http://127.0.0.1:18081
          php api/cron_smart_shopping.php
          python3 -c "import sqlite3; db=sqlite3.connect('data/evershelf.db'); assert db.execute('PRAGMA quick_check').fetchone()[0]=='ok'"

  kiosk-compile:
    name: Android kiosk Kotlin compile (no APK publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: Compile native kiosk sources without signing or publishing
        working-directory: evershelf-kiosk
        run: gradle :app:compileDebugKotlin --no-daemon

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Docker build attempt $attempt/3..."
            if docker build -t evershelf-test .; then
              exit 0
            fi
            echo "Attempt $attempt failed — retrying in 20s..."
            sleep 20
          done
          echo "Docker build failed after 3 attempts"
          exit 1

      - name: Test container starts
        run: |
          docker run -d --name test-evershelf -p 8080:80 evershelf-test
          sleep 5
          curl -f http://localhost:8080/ || exit 1
          docker exec test-evershelf php -r 'if (!class_exists("SQLite3") || !method_exists("SQLite3", "backup")) {fwrite(STDERR, "SQLite3 online backup API unavailable\n"); exit(1);} echo "SQLite3 restore extension ready\n";'
          docker stop test-evershelf

  validate-translations:
    name: Validate Translation Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON syntax
        run: |
          for f in translations/*.json; do
            echo "Checking $f..."
            python3 -c "import json; json.load(open('$f'))" || exit 1
          done
          echo "All translation files valid."

      - name: Check translation completeness
        run: |
          python3 -c "
          import json, sys
          base = json.load(open('translations/it.json'))
          base_keys = set(base.keys())
          ok = True
          import glob
          for f in glob.glob('translations/*.json'):
              if 'it.json' in f:
                  continue
              lang = json.load(open(f))
              lang_keys = set(lang.keys())
              missing = base_keys - lang_keys
              if missing:
                  ok = False
                  print(f'{f}: {len(missing)} missing keys')
                  for k in sorted(missing)[:10]:
                      print(f'  - {k}')
                  if len(missing) > 10:
                      print(f'  ... and {len(missing)-10} more')
              else:
                  print(f'{f}: complete ✓')
          if not ok:
              sys.exit(1)
          "


  # CI deliberately stops at testing. No Git push, release, or package publish
  # is allowed from push/PR events, including pushes to 'develop'.
  # Use the separately gated workflow_dispatch release workflows explicitly.
